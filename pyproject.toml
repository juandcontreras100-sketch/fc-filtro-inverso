[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fc-filtro-inverso"
version = "0.1.0"
description = "Ecualizador FFT full-duplex con filtro inverso regularizado"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "sounddevice==0.5.6",
    "pyqtgraph==0.14.0",
    "PySide6==6.11.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
fc-filtro-inverso = "main:main"
fc-filtro-calibrar = "calibrate_hardware:main"
fc-filtro-analisis = "analisis_numerico:main"

[tool.setuptools]
py-modules = [
    "main",
    "calibrate_hardware",
    "generar_medicion_demo",
    "analisis_numerico",
    "inverse_filter",
]

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]